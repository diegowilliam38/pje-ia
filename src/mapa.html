<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Mapa mental — TecJustiça PJe</title>
    <link rel="stylesheet" href="fontes.css" />
    <link rel="stylesheet" href="ui.css" />
    <link rel="stylesheet" href="mapa.css" />
  </head>
  <body>
    <header class="topo">
      <img src="../icons/icon48.png" alt="" width="28" height="28" />
      <div class="tit">
        <span class="t serif">Mapa mental</span>
        <span class="s" id="subtitulo">carregando…</span>
      </div>
      <div class="acoes">
        <span class="grupo" role="group" aria-label="Nível de detalhe">
          <span class="rot">Detalhe</span>
          <button data-nivel="1" title="Mostrar só os eixos principais">1</button>
          <button data-nivel="2" class="on" title="Eixos e seus tópicos (padrão)">2</button>
          <button data-nivel="3" title="Três níveis abertos">3</button>
          <button data-nivel="0" title="Abrir o mapa inteiro">Tudo</button>
        </span>
        <span class="grupo" role="group" aria-label="Zoom">
          <button id="mais" title="Aproximar" aria-label="Aproximar"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg></button>
          <button id="menos" title="Afastar" aria-label="Afastar"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
          <button id="ajustar" title="Ajustar o mapa à tela"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M10 20H4v-6"/><path d="M20 4l-7 7"/><path d="M4 20l7-7"/></svg><span>Ajustar</span></button>
        </span>
        <span class="grupo">
          <button id="md" title="Baixar o texto do mapa em Markdown (.md)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="M7 11l5 5 5-5"/><path d="M5 20h14"/></svg><span>.md</span></button>
          <button id="imprimir" title="Imprimir o mapa ou salvar em PDF"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 9V4h10v5"/><rect x="3.5" y="9" width="17" height="7" rx="2"/><path d="M7 14h10v6H7z"/></svg><span>Imprimir</span></button>
          <button id="tema" title="Tema escuro" aria-label="Tema escuro"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
        </span>
      </div>
    </header>

    <main class="tela">
      <svg id="mapa" aria-label="Mapa mental do processo"></svg>
      <div class="aviso" id="aviso" hidden></div>
      <div class="rodape">
        <div class="legenda" id="legenda" hidden></div>
        <p class="dica">
          Clique num círculo para abrir ou fechar o ramo · arraste para mover · role para dar zoom
        </p>
      </div>
    </main>

    <script src="../vendor/d3.min.js"></script>
    <script src="../vendor/markmap-view.js"></script>
    <script src="mapa.js"></script>
  </body>
</html>
